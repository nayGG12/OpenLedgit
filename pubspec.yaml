name: open_ledger
description: "Une application de gestion de finances personnelles pour suivre vos dépenses et revenus."
publish_to: 'none'

version: 4.0.0+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  csv: ^6.0.0
  intl: ^0.20.2  # <--- MODIFIE CETTE LIGNE (au lieu de ^0.19.0)
  shared_preferences: ^2.3.2
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  mobile_scanner: ^5.2.3

flutter:
  uses-material-design: true

  # Déclaration des assets de l'application
  assets:
    - assets/img/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/logo.png"
  min_sdk_android: 21

# Configuration de l'écran de chargement avec un fond 100% noir
flutter_native_splash:
  color: "#000000"
  image: "assets/img/logo.png"
  branding: null
  android_12:
    color: "#000000"
    image: "assets/img/logo.png"
  web: false